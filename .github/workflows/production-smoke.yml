name: Production smoke tests

on:
  workflow_dispatch:

  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Playwright production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"
      SMOKE_BASE_URL: https://springmeadowcommunity-1nrq.onrender.com
      SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
      SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wake Render service
        run: |
          curl \
            --fail \
            --location \
            --retry 12 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 180 \
            "$SMOKE_BASE_URL"

      - name: Run production smoke tests
        run: |
          npx playwright test tests/e2e/smoke.spec.mjs \
            --project=chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-playwright-report
          path: playwright-report/
          retention-days: 3