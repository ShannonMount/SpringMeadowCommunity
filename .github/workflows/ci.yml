name: CI

on:
  push:
    branches:
      - feat/add-smoke-artifacts
  pull_request:
    branches:
      - feat/add-smoke-artifacts

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - run: npx playwright test tests/e2e/smoke.spec.mjs --project=chromium --reporter=list
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          SMOKE_SESSION_COOKIE_NAME: ${{ secrets.SMOKE_SESSION_COOKIE_NAME }}
          SMOKE_SESSION_COOKIE_VALUE: ${{ secrets.SMOKE_SESSION_COOKIE_VALUE }}